<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14122b; --bg:#f4f4fb; --surface:#fff; --line:#e3e2f0; --mute:#65637f;
  --accent:#7c5cff; --on-accent:#fff; --mint:#4de1c1;
  --sans:'Plus Jakarta Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,18,43,.06),0 14px 34px -14px rgba(20,18,43,.22);
  --shadow-up:0 2px 4px rgba(20,18,43,.08),0 24px 48px -16px rgba(20,18,43,.32);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 420px at 88% -120px,color-mix(in srgb,var(--accent) 18%,transparent),transparent),var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3.5vw,40px)}
.mono{font:700 .68rem var(--mono);letter-spacing:.09em;text-transform:uppercase}

/* top row */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0 16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand svg{width:26px;height:26px;display:block}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--mute)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:32px;color:#fff;isolation:isolate;
  background:linear-gradient(135deg,#17133a 0%,#2a1d73 55%,#4429b0 100%);
  padding:clamp(28px,6vw,72px) clamp(22px,5vw,64px);box-shadow:var(--shadow-up)}
.hero::before{content:'';position:absolute;inset:auto -10% -60% auto;width:70%;aspect-ratio:1;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 65%,transparent),transparent 65%)}
.hero .mosaic{position:absolute;right:0;top:0;height:100%;width:min(62%,640px);z-index:-1;opacity:.9;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.hero .mosaic svg{width:100%;height:100%;display:block}
.hero .tagline{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.hero .tagline i{width:8px;height:8px;border-radius:2px;background:var(--mint);box-shadow:0 0 12px var(--mint)}
h1.title{font-size:clamp(2.6rem,8.4vw,6rem);line-height:.96;letter-spacing:-.045em;font-weight:800;margin:22px 0 16px;max-width:12ch;overflow-wrap:anywhere}
.title .dot{color:var(--mint)}
.hero .sub{max-width:44ch;font-size:clamp(1rem,2vw,1.25rem);color:rgba(255,255,255,.78);margin:0 0 28px}
.hero .cta{display:inline-flex;gap:8px;align-items:center;border:0;cursor:pointer;padding:13px 20px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:.95rem;transition:transform .2s}
.hero .cta:hover{transform:translateY(-2px)}

/* sections */
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:clamp(40px,6vw,64px) 0 20px}
.sh h2{margin:0;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:-.035em;font-weight:800;line-height:1.05}
.sh p{margin:6px 0 0;color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.live i{width:9px;height:9px;border-radius:50%;background:#12b886;box-shadow:0 0 0 4px rgba(18,184,134,.18)}

/* unit cards (Now teaching) */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px}
.ucard{display:flex;flex-direction:column;background:var(--surface);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.ucard:hover{transform:translateY(-6px);box-shadow:var(--shadow-up)}
.ucard .thumb{aspect-ratio:4/3}
.ucard .body{padding:clamp(20px,3vw,30px);gap:14px;flex:1}
.ucard h3{margin:0;font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.08;letter-spacing:-.03em;font-weight:800}
.ucard .sum{font-size:1.02rem}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.9rem}
.go span{transition:transform .2s}.ucard:hover .go span{transform:translateX(4px)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font:600 .82rem var(--sans);color:var(--ink);transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{border:1px solid var(--line);background:var(--surface);padding:10px 16px;min-width:220px;border-radius:999px;font:500 .9rem var(--sans)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px;padding-bottom:64px}
.card{display:flex;flex-direction:column;background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-up)}
.thumb{aspect-ratio:16/10;overflow:hidden;background:#1d1850}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img,.card:hover .thumb svg,.ucard:hover .thumb img{transform:scale(1.05)}
.body{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:20px 22px 22px}
.card .body{flex:1}
.body .row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);flex-wrap:wrap}
.card h2{margin:0;font-size:1.3rem;line-height:1.15;letter-spacing:-.02em;font-weight:700}
.plain{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;letter-spacing:inherit;color:inherit}
.sum{margin:0;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 13%,#fff);color:var(--ink);font:700 .66rem var(--mono);text-transform:uppercase;letter-spacing:.07em}
.badge{padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 .66rem var(--mono);text-transform:uppercase;letter-spacing:.07em}
.badge.mint{background:var(--mint);color:var(--ink)}
.is-hidden{opacity:.55}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.empty{grid-column:1/-1;padding:48px 0;color:var(--mute);font-size:1.1rem}

/* post view */
.back{display:inline-flex;gap:8px;margin:8px 0 0;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font-weight:600;font-size:.85rem}
.back:hover{border-color:var(--accent)}
.post-head{padding:clamp(20px,4vw,44px) 0 28px}
.post{max-width:760px;margin:0 auto}
.post h1{font-size:clamp(2.2rem,6.4vw,4.4rem);line-height:1;letter-spacing:-.045em;font-weight:800;margin:18px 0 16px;max-width:18ch;overflow-wrap:anywhere}
.post .lede{font-size:clamp(1.1rem,2.2vw,1.4rem);color:var(--mute);max-width:48ch;margin:0}
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute)}
.cover{aspect-ratio:4/3;overflow:hidden;border-radius:28px;background:#1d1850;box-shadow:var(--shadow-up)}
.cover img,.cover svg{width:100%;height:100%;object-fit:cover;display:block}
.prose{margin:24px 0 0;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,56px);font-size:1.08rem;line-height:1.75}
.prose p{margin:0 0 1.2em}
.prose>*:first-child{margin-top:0}
.prose h2{display:flex;align-items:center;gap:12px;font-size:1.55rem;line-height:1.15;letter-spacing:-.03em;margin:1.8em 0 .7em}
.prose h2::before{content:'';flex:none;width:9px;height:1.1em;border-radius:5px;background:var(--accent)}
.prose h3{font-size:1.2rem;margin:1.6em 0 .4em;letter-spacing:-.02em}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1.2em}.prose li{margin:.45em 0}
.prose li::marker{color:var(--accent);font-weight:700}
.prose ol{list-style:none;padding-left:0;counter-reset:n}
.prose ol>li{counter-increment:n;position:relative;padding-left:2.6em;min-height:1.9em}
.prose ol>li::before{content:counter(n);position:absolute;left:0;top:.1em;width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 .8rem var(--mono)}
.prose img{max-width:100%;height:auto;display:block;margin:1.6em 0;border-radius:16px}
.prose blockquote{margin:1.6em 0;padding:18px 22px;border-radius:18px;background:color-mix(in srgb,var(--accent) 10%,#fff);font-size:1.15rem;font-weight:600;line-height:1.45}
.prose a{color:inherit;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0 0}
.pn button{background:var(--surface);border:0;border-radius:20px;box-shadow:var(--shadow);text-align:left;padding:20px 22px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .2s}
.pn button:hover{transform:translateY(-3px)}
.pn button:last-child{text-align:right;align-items:flex-end}
.pn strong{font-size:1.05rem;letter-spacing:-.02em;line-height:1.2}
.pn .mono{color:var(--mute)}

/* rich text formatting */
.prose .objective{position:relative;overflow:hidden;padding:22px 26px;border-radius:22px;color:#fff;font-size:1.1rem;line-height:1.55;background:linear-gradient(135deg,#17133a,#4429b0);box-shadow:var(--shadow)}
.prose .objective::after{content:'';position:absolute;right:-26px;top:-26px;width:120px;height:120px;border-radius:28px;background:var(--mint);opacity:.22;transform:rotate(18deg)}
.prose .objective strong{display:block;margin-bottom:6px;font:700 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.prose h2.step{margin:2.4em 0 .9em;font-size:1.6rem}
.prose h2.step::before{display:none}
.prose h2.step .n{flex:none;width:2.5rem;height:2.5rem;border-radius:12px;background:var(--ink);color:var(--mint);display:grid;place-items:center;font:800 1.1rem var(--mono);box-shadow:3px 3px 0 var(--accent)}
.prose ul:has(>li.lbl){list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.prose ul:has(>li.lbl)>li{margin:0;padding:18px 20px;border-radius:18px;border-top:5px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,#fff);box-shadow:0 1px 2px rgba(20,18,43,.06);font-size:.98rem;line-height:1.55}
.prose ul:has(>li.lbl)>li:nth-child(4n+2){border-top-color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,#fff)}
.prose ul:has(>li.lbl)>li:nth-child(4n+3){border-top-color:#ffc83d;background:#fff8e1}
.prose ul:has(>li.lbl)>li:nth-child(4n+4){border-top-color:#ff6b9d;background:#fff0f5}
.prose li.lbl>strong:first-child{display:block;margin-bottom:4px;font-size:1.02rem;letter-spacing:-.01em}
.prose ol>li:not(:last-child)::after{content:'';position:absolute;left:.95em;top:2.2em;bottom:-.7em;width:2px;margin-left:-1px;background:color-mix(in srgb,var(--accent) 28%,#fff)}
.prose ol:has(>li.lbl)>li{margin:0 0 12px;padding:16px 20px 16px 4em;border-radius:18px;background:color-mix(in srgb,var(--accent) 7%,#fff)}
.prose ol:has(>li.lbl)>li::before{left:16px;top:16px}
.prose ol:has(>li.lbl)>li::after{display:none}
.prose blockquote{position:relative;padding:26px 28px 26px 68px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,#fff),color-mix(in srgb,var(--mint) 16%,#fff))}
.prose blockquote::before{content:'\201C';position:absolute;left:20px;top:8px;font:800 4rem/1 var(--sans);color:var(--accent)}

/* footer */
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 30px;margin-top:40px;border-top:1px solid var(--line);color:var(--mute)}
.foot button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}

/* buttons */
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);padding:10px 16px;cursor:pointer;border-radius:12px;font:600 .82rem var(--sans);line-height:1.2;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:.74rem;border-radius:10px}
.btn.danger:hover{background:#d92d20;border-color:#d92d20;color:#fff}

/* edit bar */
.bar{position:sticky;top:0;z-index:20;padding:8px clamp(8px,2vw,24px)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 10px 8px 18px;border-radius:18px;background:rgba(20,18,43,.92);backdrop-filter:blur(12px);color:#fff;box-shadow:var(--shadow-up)}
.bar .state{margin-right:auto}
.bar .dirty{color:#ffd166}
.bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.bar .btn:hover{background:rgba(255,255,255,.2)}
.bar .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bar :focus-visible{outline-color:#fff}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(720px,94vw);max-height:92vh;overflow:auto;border-radius:26px;box-shadow:0 30px 80px rgba(20,18,43,.45)}
dialog::backdrop{background:rgba(20,18,43,.55);backdrop-filter:blur(3px)}
.dlg{padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:16px}
.dh{margin:0;font-size:1.6rem;letter-spacing:-.03em;font-weight:800;line-height:1.1}
.dlg label,.dlg .field{display:flex;flex-direction:column;gap:6px}
.lab{font:700 .66rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.dlg input[type=text],.dlg input:not([type]),.dlg input[type=date],.dlg input[type=password],.dlg textarea{border:1px solid var(--line);background:#fbfbff;padding:11px 13px;border-radius:12px;width:100%}
.dlg input:focus,.dlg textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.dlg textarea{resize:vertical;line-height:1.5;font-size:.95rem}
.dlg input[type=color]{width:54px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}.pn{grid-template-columns:1fr}.hero .mosaic{opacity:.35;width:100%}}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1}
.hint{font-size:.82rem;color:var(--mute);margin:0}
.checks{display:flex;gap:10px 22px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:8px;font-size:.92rem}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.err{color:#d92d20;margin:0;min-height:1.2em;font-size:.9rem}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);border-radius:50%;cursor:pointer;padding:0}
.steps{margin:0;padding-left:1.2em}.steps li{margin:.35em 0}
.code{font:.75rem/1.4 var(--mono)!important;height:110px}
.ask{margin:0;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:99;font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;max-width:92vw;box-shadow:var(--shadow-up)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      "summary": "Brainstorm concepts, choose and justify the best one, then plan exactly how you will make it.",
      "body": "**Objective:** Brainstorm design concepts, select the best option, and plan the creation process.\n\n# Step 1: Brainstorming & initial sketching\n1. Sketch at least **3 distinct logo concepts** on paper using traditional isometric or square grid paper.\n2. Focus on bold shapes, high contrast, and clear silhouettes.\n\n# Step 2: Selecting and justifying the best idea\n1. Evaluate your sketches against the Stage 1 success criteria.\n2. Choose the strongest concept and explain why it fits the grid constraint best. Symmetrical shapes and strong diagonal lines work best on pixel grids.\n\n# Step 3: Step-by-step creation plan\n1. **Digital vector draft:** Open a vector graphic tool (Illustrator, Inkscape or Figma) to draw the clean, full-scale logo.\n2. **Grid overlay:** Place a pixel grid over the vector design to map out where pixels will fall.\n3. **Pixel conversion:** Open a pixel art editor (Piskel, Aseprite or Photoshop's Pencil tool) and block out the main silhouette cell by cell.\n4. **Refinement:** Clean up dithering and stray pixels, adjust shading and highlights, then export the final asset.",

      "summary": "Turn a clean vector logo into a retro pixel-art asset, and learn how constraints shape great design.",
      "body": "# The design brief\nCreate a **minimalist vector-style logo** for a chosen brand or identity, then convert that high-resolution vector design into a **low-resolution retro pixel art** asset.\n\n# Why pixel art?\nPixel art bridges modern graphic design with nostalgic 8-bit digital culture. It teaches us how to make design choices when we are **constrained by a limited grid and colour palette**.\n\n# What we cover until the end of October\n- **Stage 1: Inquiring & Analysing.** Understand the problem, investigate existing solutions, set design specifications.\n- **Stage 2: Developing Ideas.** Brainstorm, choose the best idea, plan how to make it.\n- **Knowledge check / quiz.** A standalone quiz to assess your learning.\n\n> Great pixel art is not about adding detail. It is about knowing exactly which details to remove.",

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s, r){ return (r||document).querySelector(s); };
var app = $('#app'), layer = $('#layer');
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var today = function(){ return new Date().toISOString().slice(0,10); };
var fmtDate = function(d){ if(!d) return ''; var t = new Date(d+'T00:00:00'); return isNaN(t) ? esc(d) : t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
var fmtShort = function(d){ var t = new Date(d+'T00:00:00'); return isNaN(t) ? esc(d) : t.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
var uid = function(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); };
var ls = {
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* passcode hash (cyrb53): keeps the edit panel away from curious students.
   It is a door latch, not a vault. */
function hash(str){
  var h1=0xdeadbeef, h2=0x41c6ce57, ch;
  for(var i=0;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
var passHash = function(p){ return hash('myp-design:'+p); };
function fixUrl(u){
  u = (u||'').trim();
  var m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/open\?id=([\w-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200';
  return /^(https?:\/\/|data:image\/)/i.test(u) ? u : '';
}
function onColor(hex){
  var n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  return (0.299*r+0.587*g+0.114*b) > 150 ? '#14122b' : '#ffffff';
}

/* ---------- state ---------- */
var DRAFT = 'design-journal-draft-v2';
var DEFAULT_TAGS = ['Overview','Stage 1','Stage 2','Quiz','Showcase','Class news'];
var ACCENTS = ['#7c5cff','#ff4b1f','#2f5bff','#00a676','#ff5fa2','#ffb400'];

function normalise(d){
  d = d || {};
  var s = d.settings || {};
  return {
    settings: {
      title: s.title || 'Design Journal',
      subtitle: s.subtitle || '',
      accent: /^#[0-9a-f]{6}$/i.test(s.accent||'') ? s.accent : '#7c5cff',
      pass: s.pass || ''
    },
    updated: d.updated || 0,
    posts: (Array.isArray(d.posts) ? d.posts : []).map(function(p){
      return { id:p.id||uid(), title:p.title||'Untitled', date:p.date||today(), tag:p.tag||'', summary:p.summary||'',
               body:p.body||'', cover:p.cover||'', pinned:!!p.pinned, hidden:!!p.hidden, featured:!!p.featured, until:p.until||'' };
    })
  };
}
var data = normalise(JSON.parse($('#blog-data').textContent));
var publishedSnapshot = JSON.stringify(data);
var st = { edit:false, dirty:false, view:'list', tag:'All', q:'' };

function commit(){
  data.updated = Date.now();
  st.dirty = true;
  ls.set(DRAFT, JSON.stringify(data));
  render();
}
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  layer.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}

/* ---------- tiny markdown (escaped first, so safe) ---------- */
function inline(s){
  return s
    .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function md(src){
  var lines = esc(src).split(/\r?\n/), out = [], para = [], stack = [];
  function flushP(){ if(para.length){ var t = inline(para.join('<br>')); out.push(/^<strong>Objective:<\/strong>/i.test(t) ? '<p class="objective">'+t+'</p>' : '<p>'+t+'</p>'); para = []; } }
  function closeTo(n){ while(stack.length>n) out.push('</'+stack.pop()+'>'); }
  lines.forEach(function(l){
    var m;
    if(!l.trim()){ flushP(); closeTo(0); return; }
    if((m = l.match(/^##\s+(.*)/))){ flushP(); closeTo(0); out.push('<h3>'+inline(m[1])+'</h3>'); return; }
    if((m = l.match(/^#\s+(.*)/))){ flushP(); closeTo(0); var sm = m[1].match(/^Step\s+(\d+)\s*[:.\u2013-]\s*(.*)/i);
      out.push(sm ? '<h2 class="step"><span class="n">'+sm[1]+'</span><span>'+inline(sm[2])+'</span></h2>' : '<h2>'+inline(m[1])+'</h2>'); return; }
    if((m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)/))){
      flushP();
      var depth = Math.floor(m[1].length/2), type = /\d/.test(m[2]) ? 'ol' : 'ul';
      closeTo(depth+1);
      while(stack.length<=depth){ out.push('<'+type+'>'); stack.push(type); }
      if(stack[depth]!==type){ out.push('</'+stack.pop()+'><'+type+'>'); stack.push(type); }
      var li = inline(m[3]); out.push((/^<strong>/.test(li) ? '<li class="lbl">' : '<li>')+li+'</li>');
      return;
    }
    if((m = l.match(/^&gt;\s?(.*)/))){ flushP(); closeTo(0); out.push('<blockquote>'+inline(m[1])+'</blockquote>'); return; }
    closeTo(0); para.push(l);
  });
  flushP(); closeTo(0);
  return out.join('\n');
}

/* ---------- generated art (used when a post has no cover image) ---------- */
function rng(seed){
  var s = parseInt(hash(seed),36) || 1;
  return function(){ s = (s*1664525+1013904223)>>>0; return s/4294967296; };
}
function art(seed){
  var r = rng(seed);
  var bgs = ['#1d1850','#2b2170','var(--accent)'];
  var bg = bgs[Math.floor(r()*3)];
  var pal = ['var(--accent)','#4de1c1','#ffd166','#ff6b9d','#ffffff'].filter(function(c){ return c!==bg; });
  var svg = '<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="250" fill="'+bg+'"/>';
  for(var i=0;i<3;i++){
    var c = pal[Math.floor(r()*pal.length)], t = Math.floor(r()*4);
    var x = 40+r()*300, y = 30+r()*190, k = 40+r()*70;
    if(t===0) svg += '<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="'+(k*.8).toFixed(0)+'" fill="'+c+'"/>';
    else if(t===1) svg += '<rect x="'+(x-k/2).toFixed(0)+'" y="'+(y-k/2).toFixed(0)+'" width="'+k.toFixed(0)+'" height="'+(k*(.6+r()*.9)).toFixed(0)+'" rx="10" fill="'+c+'"/>';
    else if(t===2) svg += '<polygon points="'+x.toFixed(0)+','+(y-k).toFixed(0)+' '+(x+k).toFixed(0)+','+(y+k*.7).toFixed(0)+' '+(x-k).toFixed(0)+','+(y+k*.7).toFixed(0)+'" fill="'+c+'"/>';
    else svg += '<path d="M'+x.toFixed(0)+' '+y.toFixed(0)+' h'+k.toFixed(0)+' a'+k.toFixed(0)+' '+k.toFixed(0)+' 0 0 1 -'+k.toFixed(0)+' '+k.toFixed(0)+' z" fill="'+c+'"/>';
  }
  return svg + '</svg>';
}
function mosaic(seed){
  var r = rng(seed), cols = 16, rows = 9, s = 36, g = 8, o = '';
  var cs = ['var(--accent)','#4de1c1','#ffffff','#ffffff','#ffd166'];
  for(var j=0;j<rows;j++) for(var i=0;i<cols;i++){
    if(r() < (i/cols)*0.95){
      o += '<rect x="'+(i*(s+g))+'" y="'+(j*(s+g))+'" width="'+s+'" height="'+s+'" rx="6" fill="'+cs[Math.floor(r()*cs.length)]+'" fill-opacity="'+(0.12+r()*0.5).toFixed(2)+'"/>';
    }
  }
  return '<svg viewBox="0 0 '+(cols*(s+g))+' '+(rows*(s+g))+'" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">'+o+'</svg>';
}
var coverHtml = function(p){ return p.cover ? '<img src="'+esc(p.cover)+'" alt="" loading="lazy">' : art(p.id); };

/* ---------- views ---------- */
function applyTheme(){
  var a = data.settings.accent;
  document.documentElement.style.setProperty('--accent', a);
  document.documentElement.style.setProperty('--on-accent', onColor(a));
  document.title = data.settings.title;
}
var visible = function(){ return data.posts.filter(function(p){ return st.edit || !p.hidden; }); };
var newestFirst = function(a,b){ return ((b.pinned?1:0)-(a.pinned?1:0)) || b.date.localeCompare(a.date); };
var isLive = function(p){ return p.featured && (!p.until || p.until >= today()); };
function tools(p){
  if(!st.edit) return '';
  return '<div class="tools">'+
    '<button class="btn sm" data-act="edit" data-id="'+p.id+'">Edit</button>'+

    '<button class="btn sm danger" data-act="del" data-id="'+p.id+'">Delete</button></div>';
}
function bar(){
  return '<div class="bar"><div class="in">'+
    '<span class="state mono">Edit mode '+(st.dirty?'<span class="dirty">● unpublished changes</span>':'')+'</span>'+
    '<button class="btn" data-act="new">+ New post</button>'+
    '<button class="btn" data-act="settings">Settings</button>'+

    '<button class="btn" data-act="exit">Exit</button></div></div>';
}
function foot(){

    (st.edit ? '<span>Teacher mode</span>' : '<button data-act="unlock">Teacher sign in</button>')+'</div>';
}
var brandMark = '<svg viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true"><rect width="6" height="6" rx="1.2" fill="var(--ink)"/><g fill="var(--mint)"><rect x="1" y="1" width="2" height="2"/><rect x="3" y="3" width="2" height="2"/></g><rect x="3" y="1" width="2" height="2" fill="var(--accent)"/></svg>';

function listView(){
  var all = visible();
  var live = all.filter(isLive);
  var latest = live.reduce(function(m,p){ return p.until && p.until>m ? p.until : m; }, '');

  }).join('');
  return '<div class="top"><div class="brand mono">'+brandMark+'<span>Year 6 · MYP Design</span></div>'+
      '<span class="pill mono">'+all.length+' posts</span></div>'+
    '<header class="hero"><div class="mosaic">'+mosaic(data.settings.title)+'</div>'+
      (live.length ? '<span class="tagline mono"><i></i>Now teaching'+(latest?' · until '+fmtShort(latest):'')+'</span>' : '<span class="tagline mono"><i></i>Welcome</span>')+
      '<h1 class="title">'+esc(data.settings.title)+'<span class="dot">.</span></h1>'+
      (data.settings.subtitle ? '<p class="sub">'+esc(data.settings.subtitle)+'</p>' : '')+
      (live.length ? '<button class="cta" data-act="jump">See what we are learning <span aria-hidden="true">↓</span></button>' : '')+
    '</header>'+
    '<section id="now"></section>'+
    '<div class="sh"><div><h2 id="allh">All posts</h2></div></div>'+
    '<div class="controls"><div class="chips" role="group" aria-label="Filter posts">'+chips+'</div>'+
    '<input class="search" id="q" type="search" placeholder="Search posts" aria-label="Search posts" value="'+esc(st.q)+'"></div>'+
    '<main><div class="grid" id="grid"></div></main>';
}
function unitCard(p){
  return '<article class="ucard'+(p.hidden?' is-hidden':'')+'" data-act="open" data-id="'+p.id+'">'+
    '<div class="thumb">'+coverHtml(p)+'</div>'+

      (p.until?'<span class="badge">Until '+fmtShort(p.until)+'</span>':'')+(p.hidden?'<span class="badge mint">Hidden</span>':'')+'</div>'+
    '<h3><button class="plain" data-act="open" data-id="'+p.id+'">'+esc(p.title)+'</button></h3>'+

    tools(p)+
    '<span class="go">Open the guide <span aria-hidden="true">→</span></span></div></article>';
}
function drawGrid(){
  var g = $('#grid'); if(!g) return;
  var filtering = st.tag!=='All' || !!st.q;
  var now = $('#now'), live = visible().filter(isLive).sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(now){
    if(!filtering && live.length){
      now.innerHTML = '<div class="sh"><div><h2><span class="live"><i></i>Now teaching</span></h2><p>The units we are working on right now.</p></div></div>'+
        '<div class="units">'+live.map(unitCard).join('')+'</div>';
    } else now.innerHTML = '';
  }
  var h = $('#allh'); if(h) h.textContent = filtering ? 'Results' : 'All posts';
  var list = visible().filter(function(p){
    if(!filtering && live.indexOf(p)>-1) return false;
    return (st.tag==='All' || p.tag===st.tag) &&
           (!st.q || (p.title+' '+p.summary+' '+p.body+' '+p.tag).toLowerCase().indexOf(st.q)>-1);
  }).sort(newestFirst);
  if(!list.length){
    g.innerHTML = '<p class="empty">'+(filtering ? 'Nothing matches that.' : (data.posts.length ? 'Everything is featured above.' : (st.edit ? 'No posts yet. Click “+ New post” to write your first one.' : 'No posts yet. Check back soon.')))+'</p>';
    return;
  }
  g.innerHTML = list.map(function(p){
    return '<article class="card'+(p.hidden?' is-hidden':'')+'" data-act="open" data-id="'+p.id+'">'+
      '<div class="thumb">'+coverHtml(p)+'</div>'+
      '<div class="body">'+
        '<div class="row mono"><span>'+fmtDate(p.date)+'</span><span class="tags">'+(p.pinned?'<span class="badge">Pinned</span>':'')+(p.hidden?'<span class="badge mint">Hidden</span>':'')+'</span></div>'+
        '<h2><button class="plain" data-act="open" data-id="'+p.id+'">'+esc(p.title)+'</button></h2>'+
        (p.summary ? '<p class="sum">'+esc(p.summary)+'</p>' : '')+
        '<div class="tags">'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+'</div>'+
        tools(p)+
      '</div></article>';
  }).join('');
}
function postView(p){
  var chrono = visible().slice().sort(function(a,b){ return a.date.localeCompare(b.date) || (a.id<b.id?-1:1); });
  var i = chrono.findIndex(function(x){ return x.id===p.id; });
  var older = chrono[i-1], newer = chrono[i+1];
  return '<div class="top"><div class="brand mono">'+brandMark+'<span>Year 6 · MYP Design</span></div></div>'+
    '<article class="post">'+
    '<button class="back" data-act="back"><span aria-hidden="true">←</span> All posts</button>'+
    '<div class="post-head">'+
      '<div class="meta mono"><span>'+fmtDate(p.date)+'</span>'+(p.tag?'<span class="tag">'+esc(p.tag)+'</span>':'')+(p.until&&p.featured?'<span class="badge">Until '+fmtShort(p.until)+'</span>':'')+(p.hidden?'<span class="badge mint">Hidden</span>':'')+'</div>'+
      '<h1>'+esc(p.title)+'</h1>'+
      (p.summary ? '<p class="lede">'+esc(p.summary)+'</p>' : '')+
      tools(p)+
    '</div>'+
    '<div class="cover">'+coverHtml(p)+'</div>'+
    '<div class="prose">'+md(p.body)+'</div>'+
    '<nav class="pn" aria-label="More posts">'+
      (older ? '<button data-act="open" data-id="'+older.id+'"><span class="mono">← Older</span><strong>'+esc(older.title)+'</strong></button>' : '<span></span>')+
      (newer ? '<button data-act="open" data-id="'+newer.id+'"><span class="mono">Newer →</span><strong>'+esc(newer.title)+'</strong></button>' : '<span></span>')+
    '</nav></article>';
}
function render(){
  applyTheme();
  var p = st.view!=='list' && data.posts.find(function(x){ return x.id===st.view; });
  if(st.view!=='list' && (!p || (p.hidden && !st.edit))) st.view = 'list';
  app.innerHTML = (st.edit ? bar() : '') + '<div class="wrap">' + (st.view==='list' ? listView() : postView(p)) + foot() + '</div>';
  if(st.view==='list') drawGrid();
}

/* ---------- dialogs ---------- */
function dlg(html){
  var d = document.createElement('dialog');
  d.innerHTML = html;
  layer.appendChild(d);
  d.addEventListener('close', function(){ d.remove(); });
  d.showModal();
  return d;
}
function ask(msg, ok){
  return new Promise(function(res){
    var v = false;
    var d = dlg('<div class="dlg"><p class="ask">'+msg+'</p><div class="actions"><button class="btn" data-act="no">Cancel</button><button class="btn primary" data-act="yes">'+(ok||'Confirm')+'</button></div></div>');
    d.addEventListener('click', function(e){ var b = e.target.closest('[data-act]'); if(b){ v = b.dataset.act==='yes'; d.close(); } });
    d.addEventListener('close', function(){ res(v); });
  });
}
function shrink(file, max, q){
  return new Promise(function(res, rej){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, max/Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = u;
  });
}
function download(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:type||'text/html'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
var slug = function(s){ return (s||'blog').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'blog'; };

function unlock(){
  var first = !data.settings.pass;
  var d = dlg('<form class="dlg"><h3 class="dh">'+(first?'Create your passcode':'Teacher sign in')+'</h3>'+
    '<p class="hint">'+(first ? 'Choose a passcode (4+ characters). You will type it each time you want to edit. Write it down.' : 'Enter your passcode to add, edit or remove posts.')+'</p>'+
    '<label><span class="lab">Passcode</span><input type="password" name="pw" required minlength="'+(first?4:1)+'" autocomplete="off"></label>'+
    '<p class="err" role="alert"></p>'+
    '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">'+(first?'Save & continue':'Sign in')+'</button></div></form>');
  var f = d.querySelector('form'); f.pw.focus();
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var h = passHash(f.pw.value);
    if(first){ data.settings.pass = h; }
    else if(h !== data.settings.pass){ d.querySelector('.err').textContent = 'That passcode is not right.'; f.pw.select(); return; }
    d.close();
    var dr = ls.get(DRAFT);
    if(dr){ try{ var dd = normalise(JSON.parse(dr)); if(dd.updated > data.updated){ data = dd; toast('Restored your unpublished draft'); } }catch(x){} }
    st.edit = true;
    if(first) commit(); else render();
  });
}

function editor(id){
  var ex = id && data.posts.find(function(p){ return p.id===id; });
  var p = ex ? Object.assign({}, ex) : { title:'', date:today(), tag:'', summary:'', body:'', cover:'', pinned:false, hidden:false, featured:false, until:'' };
  var cover = p.cover;
  var tags = Array.from(new Set(DEFAULT_TAGS.concat(data.posts.map(function(x){ return x.tag; }).filter(Boolean))));
  var d = dlg('<form class="dlg" autocomplete="off"><h3 class="dh">'+(ex?'Edit post':'New post')+'</h3>'+
    '<label><span class="lab">Title</span><input name="title" required maxlength="120" value="'+esc(p.title)+'"></label>'+
    '<div class="two"><label><span class="lab">Date</span><input type="date" name="date" required value="'+esc(p.date)+'"></label>'+
    '<label><span class="lab">Category</span><input name="tag" list="tags" maxlength="40" value="'+esc(p.tag)+'"><datalist id="tags">'+tags.map(function(t){ return '<option value="'+esc(t)+'">'; }).join('')+'</datalist></label></div>'+
    '<label><span class="lab">Short summary</span><input name="summary" maxlength="200" value="'+esc(p.summary)+'"></label>'+
    '<div class="field"><span class="lab">Cover image</span><div class="inline"><input name="cover" placeholder="Paste an image link…" value="'+(cover.indexOf('data:')===0?'':esc(cover))+'">'+
    '<label class="btn">Upload<input type="file" accept="image/*" hidden></label><button type="button" class="btn" data-act="nocover">Remove</button></div>'+
    '<p class="hint" id="cstat">'+(cover.indexOf('data:')===0?'Image attached.':'No image? A geometric cover is generated for you.')+'</p></div>'+
    '<div class="field"><span class="lab">Post</span><div class="tb">'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="h">Heading</button>'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="b"><b>Bold</b></button>'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="i"><i>Italic</i></button>'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="ul">• List</button>'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="ol">1. List</button>'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="q">“ Quote</button>'+
      '<button type="button" class="btn sm" data-act="fmt" data-f="a">Link</button></div>'+
      '<textarea name="body" rows="11"></textarea>'+
      '<p class="hint">Leave a blank line for a new paragraph. Use # for a heading. Images: ![description](https://image-link).</p></div>'+
    '<div class="two"><label class="checks"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="featured"> Show in “Now teaching”</span></label>'+
    '<label><span class="lab">…until (date)</span><input type="date" name="until" value="'+esc(p.until)+'"></label></div>'+
    '<div class="checks"><label><input type="checkbox" name="pinned"> Pin to top</label><label><input type="checkbox" name="hidden"> Hide (keep as draft)</label></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save post</button></div></form>');
  var f = d.querySelector('form');
  f.body.value = p.body; f.pinned.checked = p.pinned; f.hidden.checked = p.hidden; f.featured.checked = p.featured;
  var stat = d.querySelector('#cstat');
  f.cover.addEventListener('input', function(){ cover = f.cover.value; stat.textContent = ''; });
  d.querySelector('input[type=file]').addEventListener('change', function(e){
    var file = e.target.files[0]; if(!file) return;
    stat.textContent = 'Resizing…';
    shrink(file, 900, 0.72).then(function(url){
      cover = url; f.cover.value = '';
      stat.textContent = 'Image attached (' + Math.round(url.length*0.75/1024) + ' KB).';
    }).catch(function(){ stat.textContent = 'Could not read that image.'; });
  });
  d.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='nocover'){ cover = ''; f.cover.value = ''; stat.textContent = 'Cover removed.'; }
    if(b.dataset.act==='fmt') format(f.body, b.dataset.f);
  });
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var np = { title:f.title.value.trim(), date:f.date.value, tag:f.tag.value.trim(), summary:f.summary.value.trim(),
               body:f.body.value, cover:fixUrl(cover), pinned:f.pinned.checked, hidden:f.hidden.checked,
               featured:f.featured.checked, until:f.until.value };
    if(ex) Object.assign(ex, np); else { np.id = uid(); data.posts.push(np); }
    d.close(); commit(); toast('Post saved');
  });
  f.title.focus();
}
function format(ta, kind){
  var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s,e);
  if(kind==='b' || kind==='i'){
    var m = kind==='b' ? '**' : '*';
    ta.setRangeText(m+(sel||'text')+m, s, e, 'select');
  } else if(kind==='a'){
    ta.setRangeText('['+(sel||'link text')+'](https://)', s, e, 'select');
  } else {
    var ls0 = v.lastIndexOf('\n', s-1)+1;
    var seg = v.slice(ls0, e) || '';
    var n = 0;
    ta.setRangeText(seg.split('\n').map(function(l){ n++; return ({h:'# ', ul:'- ', q:'> '}[kind] || (n+'. '))+l; }).join('\n'), ls0, e, 'select');
  }
  ta.focus();
}

function settingsDialog(){
  var s = data.settings;
  var d = dlg('<form class="dlg"><h3 class="dh">Settings</h3>'+
    '<label><span class="lab">Page title</span><input name="title" required maxlength="60" value="'+esc(s.title)+'"></label>'+
    '<label><span class="lab">Subtitle</span><input name="subtitle" maxlength="140" value="'+esc(s.subtitle)+'"></label>'+
    '<div class="field"><span class="lab">Accent colour</span><div class="swatches"><input type="color" name="accent" value="'+esc(s.accent)+'" aria-label="Accent colour">'+
    ACCENTS.map(function(c){ return '<button type="button" class="sw" style="background:'+c+'" data-act="swatch" data-c="'+c+'" aria-label="Use '+c+'"></button>'; }).join('')+'</div></div>'+
    '<label><span class="lab">New passcode (leave blank to keep current)</span><input type="password" name="pw" autocomplete="off"></label>'+
    '<div class="field"><span class="lab">Backup</span><div class="actions" style="justify-content:flex-start">'+
      '<button type="button" class="btn sm" data-act="export">Download backup (.json)</button>'+
      '<label class="btn sm">Restore backup<input type="file" accept=".json,application/json" hidden></label></div></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save settings</button></div></form>');
  var f = d.querySelector('form');
  d.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='swatch') f.accent.value = b.dataset.c;
    if(b.dataset.act==='export') download(slug(s.title)+'-backup.json', JSON.stringify(data,null,2), 'application/json');
  });
  d.querySelector('input[type=file]').addEventListener('change', function(e){
    var file = e.target.files[0]; if(!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var imp = normalise(JSON.parse(rd.result));
        if(!imp.settings.pass) imp.settings.pass = data.settings.pass;
        data = imp; d.close(); commit(); toast('Backup restored');
      }catch(x){ toast('That file is not a valid backup'); }
    };
    rd.readAsText(file);
  });
  f.addEventListener('submit', function(e){
    e.preventDefault();
    s.title = f.title.value.trim() || 'Design Journal';
    s.subtitle = f.subtitle.value.trim();
    s.accent = f.accent.value;
    if(f.pw.value){ s.pass = passHash(f.pw.value); }
    d.close(); commit(); toast('Settings saved');
  });
}

/* ---------- publish ---------- */
function buildPage(){
  var c = document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML = '';
  c.querySelector('#layer').innerHTML = '';
  c.querySelector('#blog-data').textContent = '\n' + JSON.stringify(data, null, 2).replace(/</g,'\\u003c') + '\n';
  c.removeAttribute('style');
  return '<!DOCTYPE html>\n' + c.outerHTML;
}
function publishDialog(){
  var code = buildPage();
  var kb = Math.round(code.length/1024);
  var d = dlg('<div class="dlg"><h3 class="dh">Publish to Google Sites</h3>'+
    '<ol class="steps">'+
      '<li>Click <b>Copy embed code</b> (or download the file).</li>'+
      '<li>In Google Sites: <b>Insert → Embed → Embed code</b>, paste, then <b>Next → Insert</b>.</li>'+
      '<li>To update later: click the embed, choose its <b>edit</b> icon, replace the old code with this new code.</li>'+
      '<li>Finally press <b>Publish</b> at the top of Google Sites.</li></ol>'+
    '<p class="hint">Size: '+kb+' KB. '+(kb>600?'<b>That is large</b>, so Google Sites may refuse it. Use image links instead of uploads, or remove old images.':'Comfortable for an embed.')+'</p>'+
    '<textarea class="code" readonly aria-label="Embed code"></textarea>'+
    '<div class="actions"><button class="btn" data-act="discard">Discard unpublished changes</button><button class="btn" data-act="dl">Download .html</button><button class="btn primary" data-act="copy">Copy embed code</button></div></div>');
  var ta = d.querySelector('textarea'); ta.value = code;
  d.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var a = b.dataset.act;
    if(a==='copy'){
      var ok = function(){ st.dirty = false; render(); toast('Copied. Now paste it into Google Sites'); };
      var fallback = function(){ ta.focus(); ta.select(); var r = false; try{ r = document.execCommand('copy'); }catch(x){} if(r) ok(); else toast('Press Ctrl/Cmd+C to copy the selected code'); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, fallback); else fallback();
    }
    if(a==='dl'){ download(slug(data.settings.title)+'.html', code); st.dirty = false; render(); toast('Downloaded'); }
    if(a==='discard'){
      d.close();
      ask('Throw away every change since the last version you published? This cannot be undone.', 'Discard changes').then(function(yes){
        if(!yes) return;
        data = normalise(JSON.parse(publishedSnapshot)); ls.del(DRAFT); st.dirty = false; render(); toast('Back to the published version');
      });
    }
  });
}

/* ---------- actions ---------- */
var A = {
  open: function(id){ st.view = id; render(); window.scrollTo(0,0); },
  back: function(){ st.view = 'list'; render(); window.scrollTo(0,0); },
  tag: function(id,t){ st.tag = t.dataset.tag; render(); },
  jump: function(){ var n = $('#now'); if(n) n.scrollIntoView({behavior:'smooth',block:'start'}); },
  unlock: unlock,
  exit: function(){ st.edit = false; render(); if(st.dirty) toast('Draft saved on this device'); },
  'new': function(){ editor(); },
  edit: function(id){ editor(id); },
  settings: settingsDialog,
  publish: publishDialog,
  close: function(id,t){ t.closest('dialog').close(); },
  pin: function(id){ var p = data.posts.find(function(x){ return x.id===id; }); p.pinned = !p.pinned; commit(); },
  hide: function(id){ var p = data.posts.find(function(x){ return x.id===id; }); p.hidden = !p.hidden; commit(); },
  del: function(id){
    var p = data.posts.find(function(x){ return x.id===id; });
    ask('Delete “'+esc(p.title)+'”? You can bring it back by choosing “Discard unpublished changes” before you publish.', 'Delete').then(function(yes){
      if(!yes) return;
      data.posts = data.posts.filter(function(x){ return x.id!==id; });
      if(st.view===id) st.view = 'list';
      commit(); toast('Post deleted');
    });
  }
};
function onClick(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var fn = A[t.dataset.act];
  if(fn) fn(t.dataset.id, t, e);
}
app.addEventListener('click', onClick);
layer.addEventListener('click', onClick);
app.addEventListener('input', function(e){
  if(e.target.id==='q'){ st.q = e.target.value.trim().toLowerCase(); drawGrid(); }
});

render();
})();
</script>
