<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework</title>
<style>
:root{--bg:#fffbd3;--ink:#1f1f1f;--mute:#5f5c4a;--line:rgba(0,0,0,.14);--sans:Roboto,"Segoe UI",Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:400 clamp(15px,.55vw + 12px,19px)/1.55 var(--sans)}
#app{height:100%;display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1f5fd1;outline-offset:2px}
.wrap{width:100%;max-width:none;margin:0;padding:0 clamp(12px,3vw,40px)}
.head{flex:none;padding-top:clamp(10px,2vh,20px)}
.scroller .wrap{padding-bottom:28px}
h1{margin:0 0 4px;font-size:clamp(1.35rem,3.2vw,2.3rem);line-height:1.15}
.key{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 14px;font-size:.88rem;color:var(--mute)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px;background:var(--c)}

/* entries */
.entry{background:#fff;border-radius:8px;border-left:8px solid var(--c);margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.entry summary{list-style:none;cursor:pointer;position:relative;padding:14px 46px 12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.entry summary::-webkit-details-marker{display:none}
.entry summary::after{content:'+';position:absolute;right:16px;top:10px;font-size:1.5rem;line-height:1;color:var(--mute)}
.entry[open] summary::after{content:'\2212'}
.chip{background:var(--c);color:#fff;border-radius:999px;padding:2px 11px;font-size:.78rem;font-weight:700;letter-spacing:.02em}
.latest{background:#1f1f1f;color:#fff;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700}
.t{font-weight:700;font-size:1.12rem}
.d{width:100%;font-size:.85rem;color:var(--mute)}
.txt{padding:4px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.txt a{color:#1f5fd1;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.txt a::after{content:'\2197';font-size:.8em;margin-left:2px}
.tools{display:flex;gap:8px;padding:0 16px 14px}
.empty{padding:28px 0;color:var(--mute)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;font-size:.8rem;color:var(--mute)}
.foot button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:inherit;font:inherit}

/* buttons */
.btn{display:inline-block;border:1.5px solid #1f1f1f;background:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.85rem;line-height:1.2}
.btn:hover{background:#1f1f1f;color:#fff}
.btn.primary{background:#1f5fd1;border-color:#1f5fd1;color:#fff}
.btn.primary:hover{background:#174aa3}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn.danger:hover{background:#c62828;border-color:#c62828}
.bar{flex:none;background:#1f1f1f;color:#fff}
.bar .in{width:100%;padding:8px clamp(12px,3vw,40px);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .state{margin-right:auto;font-size:.82rem;font-weight:700}
.bar .dirty{color:#ffd54f;font-weight:400}
.bar .btn{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.bar .btn:hover{background:#fff;color:#1f1f1f}
.bar .btn.primary{background:#ffd54f;border-color:#ffd54f;color:#1f1f1f}

/* dialogs */
dialog{border:0;padding:0;border-radius:12px;width:min(640px,94%);max-height:94%;overflow:auto;background:#fff;color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dh{margin:0;font-size:1.35rem}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700}
.dlg input[type=text],.dlg input:not([type]),.dlg input[type=date],.dlg input[type=password],.dlg textarea{border:1.5px solid #bbb;border-radius:6px;padding:9px 11px;width:100%;font-weight:400;font-size:1rem;background:#fff}
.dlg textarea{resize:vertical;line-height:1.5}
.dlg input[type=color]{width:50px;height:38px;padding:2px;border:1.5px solid #bbb;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types label{flex-direction:row;align-items:center;gap:7px;border:2px solid var(--c);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.85rem}
.types input{accent-color:var(--c)}
.types label:has(input:checked){background:var(--c);color:#fff}
.field{display:flex;flex-direction:column;gap:5px}
.field>.lab{font-size:.85rem;font-weight:700}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkrow{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:#eef3fd;border:1px solid #c3d4f5}
.linkrow[hidden]{display:none}
.linkrow label{font-size:.8rem}
.hint{margin:0;font-size:.82rem;color:var(--mute);font-weight:400}
.note{margin:0;padding:9px 11px;border-radius:6px;background:#fff3cd;border:1px solid #e6cf7a;font-size:.85rem;font-weight:400}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{margin:0;color:#c62828;min-height:1.2em;font-size:.9rem;font-weight:400}
.sws{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border:2px solid #fff;box-shadow:0 0 0 1px #999;border-radius:50%;cursor:pointer;padding:0}
.steps{margin:0;padding-left:1.2em;font-weight:400}.steps li{margin:.3em 0}
.code{font:.75rem/1.4 monospace!important;height:100px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-size:.85rem;max-width:92vw}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<!-- YOUR CONTENT LIVES HERE. The page rewrites this block when you click
     Publish → Copy embed code. You don't need to touch it. -->
<script id="blog-data" type="application/json">
{
  "settings": { "title": "Homework", "bg": "#fffbd3", "pass": "" },
  "updated": 1791000000000,
  "posts": [
    {
      "id": "p-sample2",
      "title": "Week 2 homework (sample: delete me)",
      "date": "2026-10-08",
      "due": "2026-10-15",
      "type": "homework",
      "text": "1. Finish your 3 logo sketches on square grid paper.\n2. Choose your best idea and write 2 sentences explaining why it will work on a 16 × 16 grid.\n\nBring your sketches to next week's lesson."
    },
    {
      "id": "p-sample1",
      "title": "Week 1 homework (sample: delete me)",
      "date": "2026-10-01",
      "due": "2026-10-08",
      "type": "reminder",
      "text": "Find two famous logos that still look good when they are very small. Write down why they work."
    }
  ]
}
</script>

<script>
(function(){
'use strict';
var $ = function(s,r){ return (r||document).querySelector(s); };
var app = $('#app'), layer = $('#layer');
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var today = function(){ return new Date().toISOString().slice(0,10); };
var fmt = function(d,long){ var t = new Date(d+'T00:00:00'); return isNaN(t) ? '' : t.toLocaleDateString('en-GB', long ? {weekday:'short',day:'numeric',month:'short'} : {day:'numeric',month:'short',year:'numeric'}); };
var uid = function(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); };
var ls = { get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} }, del:function(k){ try{localStorage.removeItem(k);}catch(e){} } };
function hash(str){ var h1=0xdeadbeef,h2=0x41c6ce57,ch; for(var i=0;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
var passHash = function(p){ return hash('hw-blog:'+p); };
var embedded = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();

var TYPES = [
  {k:'homework', n:'Homework',   c:'#1f5fd1'},
  {k:'reminder', n:'Reminder',   c:'#b85c00'},
  {k:'project',  n:'Project',    c:'#1f7a3a'},
  {k:'test',     n:'Quiz / Test',c:'#c62828'},
  {k:'notice',   n:'Notice',     c:'#6a3dbf'}
];
var typeOf = function(k){ return TYPES.filter(function(t){ return t.k===k; })[0] || TYPES[0]; };
var BGS = ['#fffbd3','#ffffff','#e8f0fe','#e6f4ea','#fce8e6','#f1f3f4'];
var DRAFT = 'homework-blog-draft-v1';

function normalise(d){
  d = d || {}; var s = d.settings || {};
  return {
    settings:{ title:s.title||'Homework', bg:/^#[0-9a-f]{6}$/i.test(s.bg||'')?s.bg:'#fffbd3', pass:s.pass||'' },
    updated:d.updated||0,
    posts:(Array.isArray(d.posts)?d.posts:[]).map(function(p){
      return { id:p.id||uid(), title:p.title||'Homework', date:p.date||today(), due:p.due||'', type:typeOf(p.type).k, text:p.text||'' };
    })
  };
}
var data = normalise(JSON.parse($('#blog-data').textContent));
var publishedSnapshot = JSON.stringify(data);
var st = { edit:false, dirty:false };

function commit(){ data.updated = Date.now(); st.dirty = true; ls.set(DRAFT, JSON.stringify(data)); render(); }
function toast(m){ var t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = m; layer.appendChild(t); setTimeout(function(){ t.remove(); }, 3000); }

/* plain text -> safe HTML with clickable links */
function richText(s){
  var out = esc(String(s).replace(/\u0000/g,'')), links = [];
  function a(u,t){ var h = /^www\./i.test(u) ? 'https://'+u : u; links.push('<a href="'+h+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'); return '\u0000'+(links.length-1)+'\u0000'; }
  out = out.replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|www\.)[^\s)]+)\)/gi, function(_,t,u){ return a(u,t); });
  out = out.replace(/((?:https?:\/\/|www\.)[^\s\u0000]*[^\s\u0000.,;:!?)\]'"])/gi, function(u){ return a(u,u); });
  return out.replace(/\u0000(\d+)\u0000/g, function(_,i){ return links[i]; });
}

function bar(){
  return '<div class="bar"><div class="in"><span class="state">Edit mode '+(st.dirty?'<span class="dirty">● not published yet</span>':'')+'</span>'+
    '<button class="btn primary" data-act="new">+ Add this week</button>'+
    '<button class="btn" data-act="settings">Settings</button>'+
    '<button class="btn" data-act="publish">Publish</button>'+
    '<button class="btn" data-act="exit">Exit</button></div></div>';
}
function render(){
  document.documentElement.style.setProperty('--bg', data.settings.bg);
  document.title = data.settings.title;
  var list = data.posts.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var key = '<div class="key" aria-label="Colour key">'+TYPES.map(function(t){ return '<span style="--c:'+t.c+'"><i></i>'+t.n+'</span>'; }).join('')+'</div>';
  var body = list.length ? list.map(function(p,i){
    var t = typeOf(p.type);
    var dates = 'Posted '+fmt(p.date) + (p.due ? ' · Due '+fmt(p.due,true) : '');
    return '<details class="entry" style="--c:'+t.c+'"'+(i===0||st.edit?' open':'')+'>'+
      '<summary><span class="chip">'+esc(t.n)+'</span>'+(i===0?'<span class="latest">Latest</span>':'')+'<span class="t">'+esc(p.title)+'</span><span class="d">'+dates+'</span></summary>'+
      '<div class="txt">'+richText(p.text)+'</div>'+
      (st.edit ? '<div class="tools"><button class="btn sm" data-act="edit" data-id="'+p.id+'">Edit</button><button class="btn sm danger" data-act="del" data-id="'+p.id+'">Delete</button></div>' : '')+
      '</details>';
  }).join('') : '<p class="empty">'+(st.edit ? 'Nothing here yet. Click “+ Add this week”.' : 'No homework posted yet.')+'</p>';
  app.innerHTML = (st.edit ? bar() : '')+'<div class="wrap head"><h1>'+esc(data.settings.title)+'</h1>'+key+'</div>'+
    '<div class="scroller"><div class="wrap">'+body+
    '<div class="foot"><span>Newest first. Tap a title to open or close it.</span>'+(st.edit?'<span>Teacher mode</span>':'<button data-act="unlock">Teacher sign in</button>')+'</div></div></div>';
}

/* dialogs */
function dlg(html){ var d = document.createElement('dialog'); d.innerHTML = html; layer.appendChild(d); d.addEventListener('close',function(){ d.remove(); }); d.showModal(); return d; }
function ask(msg, ok){
  return new Promise(function(res){
    var v = false;
    var d = dlg('<div class="dlg"><p style="margin:0;font-size:1.05rem">'+msg+'</p><div class="actions"><button class="btn" data-act="no">Cancel</button><button class="btn primary" data-act="yes">'+(ok||'OK')+'</button></div></div>');
    d.addEventListener('click',function(e){ var b = e.target.closest('[data-act]'); if(b){ v = b.dataset.act==='yes'; d.close(); } });
    d.addEventListener('close',function(){ res(v); });
  });
}
function download(name,text,type){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:type||'text/html'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

function unlock(){
  var first = !data.settings.pass;
  var d = dlg('<form class="dlg"><h3 class="dh">'+(first?'Create your passcode':'Teacher sign in')+'</h3>'+
    '<p class="hint">'+(first?'Choose a passcode (4+ characters). You will type it each time you edit.':'Enter your passcode to add or edit homework.')+'</p>'+
    (embedded?'<p class="note">You are inside another page (such as Google Sites). Editing is most reliable in the downloaded file opened directly in your browser.</p>':'')+
    '<label>Passcode<input type="password" name="pw" required minlength="'+(first?4:1)+'" autocomplete="off"></label><p class="err" role="alert"></p>'+
    '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">'+(first?'Save &amp; continue':'Sign in')+'</button></div></form>');
  var f = d.querySelector('form'); f.pw.focus();
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var h = passHash(f.pw.value);
    if(first) data.settings.pass = h;
    else if(h !== data.settings.pass){ d.querySelector('.err').textContent = 'That passcode is not right.'; f.pw.select(); return; }
    d.close();
    var dr = ls.get(DRAFT);
    if(dr){ try{ var dd = normalise(JSON.parse(dr)); if(dd.updated > data.updated){ data = dd; toast('Restored your unpublished draft'); } }catch(x){} }
    st.edit = true;
    if(first) commit(); else render();
  });
}

function editor(id){
  var ex = id && data.posts.filter(function(p){ return p.id===id; })[0];
  var p = ex ? ex : { title:'', date:today(), due:'', type:'homework', text:'' };
  var d = dlg('<form class="dlg"><h3 class="dh">'+(ex?'Edit entry':'Add this week')+'</h3>'+
    (embedded?'<p class="note">You are inside another page. Saving can be blocked here, so edit the downloaded file directly in your browser.</p>':'')+
    '<label>Title<input name="title" required maxlength="100" placeholder="e.g. Week 8 homework" value="'+esc(p.title)+'"></label>'+
    '<div class="two"><label>Posted<input type="date" name="date" required value="'+esc(p.date)+'"></label><label>Due (optional)<input type="date" name="due" value="'+esc(p.due)+'"></label></div>'+
    '<div><div style="font-size:.85rem;font-weight:700;margin-bottom:6px">Colour code</div><div class="types">'+
      TYPES.map(function(t){ return '<label style="--c:'+t.c+'"><input type="radio" name="type" value="'+t.k+'"'+(p.type===t.k?' checked':'')+'>'+t.n+'</label>'; }).join('')+'</div></div>'+
    '<div class="field"><label class="lab" for="ptext">Homework text</label>'+
      '<div class="tb"><button type="button" class="btn sm" data-act="addlink">+ Add link</button><span class="hint">Highlight some words first to turn them into the link.</span></div>'+
      '<div class="linkrow" id="linkrow" hidden>'+
        '<label>Words to show<input name="ltext" placeholder="e.g. Open the worksheet"></label>'+
        '<label>Web address<input name="lurl" placeholder="https://docs.google.com/…" inputmode="url"></label>'+
        '<p class="err" id="lerr" role="alert"></p>'+
        '<div class="actions"><button type="button" class="btn sm" data-act="cancellink">Cancel</button><button type="button" class="btn sm primary" data-act="putlink">Insert link</button></div></div>'+
      '<textarea id="ptext" name="text" rows="12" placeholder="Paste this week\'s homework here"></textarea>'+
      '<p class="hint">Line breaks are kept. Web addresses become clickable links automatically.</p></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save</button></div></form>');
  var f = d.querySelector('form'); f.text.value = p.text; f.title.focus();
  var lr = d.querySelector('#linkrow'), lt = f.ltext, lu = f.lurl, le = d.querySelector('#lerr'), s0 = 0, e0 = 0;
  function openLink(){
    s0 = f.text.selectionStart; e0 = f.text.selectionEnd;
    lt.value = f.text.value.slice(s0,e0).replace(/\s+/g,' ').trim(); lu.value = ''; le.textContent = '';
    lr.hidden = false; (lt.value ? lu : lt).focus();
  }
  function putLink(){
    var u = lu.value.trim().replace(/\(/g,'%28').replace(/\)/g,'%29'), t = lt.value.trim().replace(/[\[\]]/g,'');
    if(/^www\./i.test(u)) u = 'https://'+u;
    if(!/^https?:\/\/[^\s]+\.[^\s]+$/i.test(u)){ le.textContent = 'Type or paste a full web address, for example https://docs.google.com/…'; lu.focus(); return; }
    f.text.setRangeText('['+(t||u)+']('+u+')', s0, e0, 'end');
    lr.hidden = true; f.text.focus();
  }
  [lt,lu].forEach(function(el){ el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); putLink(); } }); });
  d.addEventListener('click',function(e){ var b = e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='addlink') openLink();
    if(b.dataset.act==='cancellink'){ lr.hidden = true; f.text.focus(); }
    if(b.dataset.act==='putlink') putLink(); });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var np = { title:f.title.value.trim(), date:f.date.value, due:f.due.value, type:f.type.value, text:f.text.value.replace(/\s+$/,'') };
    if(ex) Object.assign(ex,np); else { np.id = uid(); data.posts.unshift(np); }
    d.close(); commit(); toast('Saved');
  });
}

function settingsDialog(){
  var s = data.settings;
  var d = dlg('<form class="dlg"><h3 class="dh">Settings</h3>'+
    '<label>Page title<input name="title" required maxlength="60" value="'+esc(s.title)+'"></label>'+
    '<div><div style="font-size:.85rem;font-weight:700;margin-bottom:6px">Background colour <span style="font-weight:400;color:#5f5c4a">(the first swatch is the Google Sites yellow)</span></div><div class="sws"><input type="color" name="bg" value="'+esc(s.bg)+'" aria-label="Background colour">'+
    BGS.map(function(c){ return '<button type="button" class="sw" style="background:'+c+'" data-act="sw" data-c="'+c+'" aria-label="Use '+c+'"></button>'; }).join('')+'</div></div>'+
    '<label>New passcode <span style="font-weight:400">(leave blank to keep the current one)</span><input type="password" name="pw" autocomplete="off"></label>'+
    '<div class="actions" style="justify-content:flex-start"><button type="button" class="btn sm" data-act="export">Download backup (.json)</button>'+
    '<label class="btn sm" style="flex-direction:row">Restore backup<input type="file" accept=".json,application/json" hidden></label></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save settings</button></div></form>');
  var f = d.querySelector('form');
  d.addEventListener('click',function(e){ var b = e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='sw') f.bg.value = b.dataset.c;
    if(b.dataset.act==='export') download('homework-backup.json', JSON.stringify(data,null,2), 'application/json'); });
  d.querySelector('input[type=file]').addEventListener('change',function(e){
    var file = e.target.files[0]; if(!file) return; var rd = new FileReader();
    rd.onload = function(){ try{ var imp = normalise(JSON.parse(rd.result)); if(!imp.settings.pass) imp.settings.pass = data.settings.pass; data = imp; d.close(); commit(); toast('Backup restored'); }catch(x){ toast('That is not a valid backup file'); } };
    rd.readAsText(file); });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    s.title = f.title.value.trim() || 'Homework'; s.bg = f.bg.value; if(f.pw.value) s.pass = passHash(f.pw.value);
    d.close(); commit(); toast('Settings saved');
  });
}

/* publish */
function buildPage(){
  var c = document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML = ''; c.querySelector('#layer').innerHTML = '';
  c.querySelector('#blog-data').textContent = '\n' + JSON.stringify(data,null,2).replace(/</g,'\\u003c') + '\n';
  c.removeAttribute('style');
  return '<!DOCTYPE html>\n' + c.outerHTML;
}
function publishDialog(){
  var code = buildPage(), kb = Math.round(code.length/1024);
  var d = dlg('<div class="dlg"><h3 class="dh">Publish to Google Sites</h3><ol class="steps">'+
    '<li>Click <b>Copy embed code</b>.</li>'+
    '<li>In Google Sites: <b>Insert → Embed → Embed code</b>, paste, then <b>Next → Insert</b>.</li>'+
    '<li>Next week: click the embed, choose its <b>edit</b> icon, and paste the new code over the old.</li>'+
    '<li>Press <b>Publish</b> at the top of Google Sites.</li></ol>'+
    '<p class="hint">Size: '+kb+' KB.</p><textarea class="code" readonly aria-label="Embed code"></textarea>'+
    '<div class="actions"><button class="btn" data-act="discard">Discard changes</button><button class="btn" data-act="dl">Download .html</button><button class="btn primary" data-act="copy">Copy embed code</button></div></div>');
  var ta = d.querySelector('textarea'); ta.value = code;
  d.addEventListener('click',function(e){ var b = e.target.closest('[data-act]'); if(!b) return; var a = b.dataset.act;
    if(a==='copy'){
      var ok = function(){ st.dirty = false; render(); toast('Copied. Now paste it into Google Sites'); };
      var fb = function(){ ta.focus(); ta.select(); var r = false; try{ r = document.execCommand('copy'); }catch(x){} if(r) ok(); else toast('Press Ctrl/Cmd+C to copy the selected code'); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok,fb); else fb();
    }
    if(a==='dl'){ download('homework-blog.html', code); st.dirty = false; render(); toast('Downloaded'); }
    if(a==='discard'){ d.close(); ask('Throw away all changes since the last version you published?','Discard').then(function(y){ if(!y) return; data = normalise(JSON.parse(publishedSnapshot)); ls.del(DRAFT); st.dirty = false; render(); toast('Back to the published version'); }); }
  });
}

var A = {
  unlock:unlock,
  exit:function(){ st.edit = false; render(); if(st.dirty) toast('Draft saved on this device'); },
  'new':function(){ editor(); },
  edit:function(id){ editor(id); },
  settings:settingsDialog, publish:publishDialog,
  close:function(id,t){ t.closest('dialog').close(); },
  del:function(id){
    var p = data.posts.filter(function(x){ return x.id===id; })[0];
    ask('Delete “'+esc(p.title)+'”? (Use Publish → Discard changes before publishing if you change your mind.)','Delete').then(function(y){
      if(!y) return; data.posts = data.posts.filter(function(x){ return x.id!==id; }); commit(); toast('Deleted'); });
  }
};
function onClick(e){ var t = e.target.closest('[data-act]'); if(!t) return; var fn = A[t.dataset.act]; if(fn) fn(t.dataset.id,t,e); }
app.addEventListener('click',onClick); layer.addEventListener('click',onClick);
render();
})();
</script>
